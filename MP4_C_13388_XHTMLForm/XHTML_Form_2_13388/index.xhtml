<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Lomba</title>
</head>
<body>
    <h1>Formulir Pendaftaran Lomba</h1>

    <form action="" method="post">
        <table cellspacing="4" cellpadding="4" border="1"
               style="border-collapse:collapse; width:100%;">
            <tr>
                <td colspan="2" style="text-align:center;">
                    <strong>Data Tim</strong>
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <label for="namaTim">Nama Tim</label>
                </td>
                <td>
                    <input type="text" id="namaTim" name="namaTim" />
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <label for="namaKetua">Nama Ketua</label>
                </td>
                <td>
                    <input type="text" id="namaKetua" name="namaKetua" />
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <label for="jumlahAnggota">Jumlah Anggota</label>
                </td>
                <td>
                    <input type="text" id="jumlahAnggota" name="jumlahAnggota" />
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <label for="prodi">Program Studi</label>
                </td>
                <td>
                    <select id="prodi" name="prodi">
                        <option>Informatika</option>
                        <option>Sistem Informasi</option>
                        <option>Teknik Industri</option>
                    </select>
                </td>
            </tr>
        </table>

        <br />

        <table cellspacing="4" cellpadding="4" border="1"
               style="border-collapse:collapse; width:100%;">
            <tr>
                <td colspan="2" style="text-align:center;">
                    <strong>Pilihan Lomba</strong>
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    Kategori Lomba
                </td>
                <td>
                    <input type="radio" id="individu" name="kategori"
                           value="Individu" />
                    <label for="individu">Individu</label>

                    <input type="radio" id="kelompok" name="kategori"
                           value="Kelompok" />
                    <label for="kelompok">Kelompok</label>
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    Bidang Lomba
                </td>
                <td>
                    <input type="checkbox" id="programming" name="bidang"
                           value="Programming" />
                    <label for="programming">Programming</label>
                    <br />

                    <input type="checkbox" id="uiux" name="bidang"
                           value="UI/UX Design" />
                    <label for="uiux">UI/UX Design</label>
                    <br />

                    <input type="checkbox" id="karyaTulis" name="bidang"
                           value="Karya Tulis" />
                    <label for="karyaTulis">Karya Tulis</label>
                </td>
            </tr>
        </table>

        <br />

        <table cellspacing="4" cellpadding="4" border="1"
               style="border-collapse:collapse; width:100%;">
            <tr>
                <td colspan="2" style="text-align:center;">
                    <strong>Informasi Karya</strong>
                </td>
            </tr>
            <tr>
                <td style="width:32%; vertical-align:top;">
                    <label for="deskripsi">Deskripsi Karya</label>
                </td>
                <td>
                    <textarea id="deskripsi" name="deskripsi"
                              rows="5" cols="40"></textarea>
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <label for="fileKarya">File Karya</label>
                </td>
                <td>
                    <input type="file" id="fileKarya" name="fileKarya" />
                </td>
            </tr>
            <tr>
                <td colspan="2" style="text-align:center;">
                    <input type="submit" name="daftar" value="Daftar" />
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
