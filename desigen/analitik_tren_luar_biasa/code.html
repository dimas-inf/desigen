</button>

<div class="mb-lg flex flex-col md:flex-row justify-between items-start md:items-end gap-sm">
<div>
<h2 class="font-headline-xl text-headline-xl text-on-surface">Analytics</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">October Overview</p>
</div>
<div class="flex gap-sm">
<button class="glass-card px-4 py-2 font-label-md text-label-md text-primary hover:bg-white/5 transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">calendar_month</span>

</div>
</div>

<div class="grid grid-cols-4 md:grid-cols-12 gap-gutter">

<div class="col-span-4 md:col-span-6 lg:col-span-4 glass-card p-lg flex flex-col relative overflow-hidden group">

<button class="text-outline hover:text-primary transition-colors">
<span class="material-symbols-outlined">more_horiz</span>
</button>
</div>
<div class="flex-grow flex items-center justify-center relative z-10 py-md">
<!-- Simulated Doughnut Chart using SVG -->
<svg class="w-48 h-48 drop-shadow-[0_0_15px_rgba(142,213,255,0.2)]" viewbox="0 0 100 100">
<!-- Background track -->
<circle cx="50" cy="50" fill="none" r="40" stroke="rgba(255,255,255,0.05)" stroke-width="12"></circle>
<!-- Segment 1: Housing (Primary) -->
<circle class="origin-center -rotate-90" cx="50" cy="50" fill="none" r="40" stroke="#8ed5ff" stroke-dasharray="100 151.3" stroke-dashoffset="0" stroke-linecap="round" stroke-width="12"></circle>
<!-- Segment 2: Food (Secondary) -->
<circle class="origin-center -rotate-90" cx="50" cy="50" fill="none" r="40" stroke="#4edea3" stroke-dasharray="60 191.3" stroke-dashoffset="-110" stroke-linecap="round" stroke-width="12"></circle>

<circle class="origin-center -rotate-90" cx="50" cy="50" fill="none" r="40" stroke="#ffbcbf" stroke-dasharray="30 221.3" stroke-dashoffset="-180" stroke-linecap="round" stroke-width="12"></circle>
</svg>

<div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">Total</span>
<span class="font-headline-lg text-headline-lg neon-text-primary">$4,250</span>
</div>
</div>
</div>
