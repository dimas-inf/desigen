<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add Expense - Finance Manager</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>

            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
        
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
    </style>
<script id="tailwind-config">

          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-tint": "#0053db",
                      "surface-container-low": "#eff4ff",
                      "on-primary-fixed": "#00174b",
                      "on-secondary-fixed": "#002113",
                      "on-tertiary": "#ffffff",
                      "on-tertiary-fixed-variant": "#930013",
                      "on-secondary-fixed-variant": "#005236",
                      "on-surface": "#0b1c30",
                      "primary-fixed": "#dbe1ff",
                      "on-tertiary-container": "#ffecea",
                      "on-error": "#ffffff",
                      "on-background": "#0b1c30",
                      "on-surface-variant": "#434655",
                      "on-error-container": "#93000a",

                      "secondary-fixed": "#6ffbbe",
                      "surface-container-lowest": "#ffffff",
                      "inverse-primary": "#b4c5ff",
                      "background": "#f8f9ff",
                      "inverse-on-surface": "#eaf1ff",
                      "surface-variant": "#d3e4fe",
                      "on-secondary-container": "#00714d",
                      "primary": "#004ac6",
                      "outline-variant": "#c3c6d7",
                      "surface-container-highest": "#d3e4fe",
                      "surface-container": "#e5eeff",
                      "secondary-container": "#6cf8bb",
                      "error": "#ba1a1a",
                      "tertiary": "#ab0b1c",
                      "on-primary-container": "#eeefff",
                      "surface-container-high": "#dce9ff",
                      "surface-dim": "#cbdbf5",
                      "primary-fixed-dim": "#b4c5ff",
                      "tertiary-container": "#cf2c30",
                      "secondary-fixed-dim": "#4edea3",
                      "outline": "#737686",
                      "error-container": "#ffdad6",
                      "tertiary-fixed": "#ffdad7",
                      "surface-bright": "#f8f9ff",
                      "on-secondary": "#ffffff",
                      "on-primary": "#ffffff",
                      "surface": "#f8f9ff",
                      "on-primary-fixed-variant": "#003ea8",
                      "inverse-surface": "#213145",
                      "secondary": "#006c49",
                      "tertiary-fixed-dim": "#ffb3ad",
                      "on-tertiary-fixed": "#410004"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "base": "4px",
                      "xs": "4px",
                      "xl": "32px",
                      "md": "16px",
                      "lg": "24px",
                      "margin-mobile": "20px",
                      "gutter-mobile": "12px",
                      "sm": "8px"
              },
              "fontFamily": {
                      "label-md": [
                              "Inter"
                      ],
                      "headline-lg": [
                              "Inter"
                      ],
                      "headline-sm": [
                              "Inter"
                      ],
                      "body-lg": [

                      ],
                      "headline-md": [

<style>
    body {
      min-height: max(884px, 100dvh);
    }

  </head>
<body class="bg-background text-on-background min-h-screen font-body-md antialiased pb-24">
<!-- TopAppBar (Transactional - Hidden Navigation Shell on purpose, providing custom Back Header) -->
<header class="flex justify-between items-center px-margin-mobile h-16 w-full max-w-[720px] mx-auto sticky top-0 bg-surface/90 backdrop-blur-xl z-40">
<button class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-on-surface">Add Expense</h1>
<div class="w-10 h-10"></div> <!-- Spacer for centering -->
</header>
<main class="w-full max-w-[720px] mx-auto px-margin-mobile pt-lg flex flex-col gap-xl">
<!-- Amount Input Area -->
<section class="flex flex-col items-center justify-center py-xl">
<p class="font-label-md text-label-md text-on-surface-variant mb-sm">Amount</p>
<div class="flex items-center justify-center relative w-full">
<span class="font-headline-lg text-headline-lg text-on-surface absolute left-4 md:left-24 top-1/2 -translate-y-1/2 opacity-50">$</span>
<input class="w-full text-center bg-transparent border-none focus:ring-0 font-headline-lg text-[48px] leading-[56px] text-on-surface font-bold p-0 m-0 placeholder-on-surface/30" placeholder="0.00" type="number"/>
</div>
</section>
<!-- Category Selection -->
<section class="bg-surface-container-lowest rounded-xl p-md shadow-[0_4px_12px_rgba(0,0,0,0.04)] flex flex-col gap-md">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Category</h2>
<div class="grid grid-cols-4 gap-gutter-mobile">
<!-- Category Item: Food -->
<button class="flex flex-col items-center gap-sm p-sm rounded-lg bg-surface-container-high border-2 border-primary transition-colors">
<div class="w-12 h-12 rounded-full bg-primary flex items-center justify-center text-on-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">restaurant</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface text-center">Food</span>
</button>
<!-- Category Item: Transport -->
<button class="flex flex-col items-center gap-sm p-sm rounded-lg hover:bg-surface-container transition-colors">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">directions_car</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant text-center">Transport</span>
</button>
<!-- Category Item: Shopping -->
<button class="flex flex-col items-center gap-sm p-sm rounded-lg hover:bg-surface-container transition-colors">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">shopping_bag</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant text-center">Shopping</span>
</button>
<!-- Category Item: Bills -->
<button class="flex flex-col items-center gap-sm p-sm rounded-lg hover:bg-surface-container transition-colors">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">receipt_long</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant text-center">Bills</span>
</button>
<!-- Category Item: Entertainment -->
<button class="flex flex-col items-center gap-sm p-sm rounded-lg hover:bg-surface-container transition-colors">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">movie</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant text-center">Entertainment</span>
</button>
<!-- Category Item: Health -->
<button class="flex flex-col items-center gap-sm p-sm rounded-lg hover:bg-surface-container transition-colors">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">favorite</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant text-center">Health</span>
</button>
<!-- Category Item: Travel -->
<button class="flex flex-col items-center gap-sm p-sm rounded-lg hover:bg-surface-container transition-colors">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">flight</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant text-center">Travel</span>
</button>
<!-- Category Item: More -->
<button class="flex flex-col items-center gap-sm p-sm rounded-lg hover:bg-surface-container transition-colors">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">more_horiz</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant text-center">More</span>
</button>
</div>
</section>
<!-- Details Section (Date & Note) -->
<section class="flex flex-col gap-md">
<div class="bg-[#F1F5F9] rounded-lg p-sm flex items-center gap-md focus-within:bg-surface-container-lowest focus-within:ring-2 focus-within:ring-primary transition-all">
<div class="w-10 h-10 flex items-center justify-center text-on-surface-variant ml-sm">
<span class="material-symbols-outlined">calendar_today</span>
</div>
<div class="flex flex-col flex-1 py-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant">Date</label>
<input class="w-full bg-transparent border-none p-0 font-body-md text-body-md text-on-surface focus:ring-0" type="date" value="2023-10-24"/>
</div>
</div>
<div class="bg-[#F1F5F9] rounded-lg p-sm flex items-start gap-md focus-within:bg-surface-container-lowest focus-within:ring-2 focus-within:ring-primary transition-all">
<div class="w-10 h-10 flex items-center justify-center text-on-surface-variant ml-sm mt-xs">
<span class="material-symbols-outlined">notes</span>
</div>
<div class="flex flex-col flex-1 py-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant">Note</label>
<textarea class="w-full bg-transparent border-none p-0 font-body-md text-body-md text-on-surface focus:ring-0 resize-none" placeholder="What was this for?" rows="2"></textarea>
</div>
</div>
</section>
<!-- Save Button Area -->
<section class="mt-lg mb-xl">
<button class="w-full bg-primary text-on-primary font-headline-sm text-headline-sm py-4 rounded-[1rem] shadow-[0_8px_20px_rgba(0,0,0,0.08)] hover:bg-primary-fixed-variant active:scale-95 transition-all flex items-center justify-center gap-sm">
<span class="material-symbols-outlined">check_circle</span>
                Save Expense
            </button>
</section>
</main>
</body></html>
